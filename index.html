<!DOCTYPE html>
<html>
<head>
    <title>Simple AI Chatbot</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        #chatbox { width: 100%; height: 400px; overflow-y: auto; background: #fff; padding: 10px; border: 1px solid #ccc; }
        #input { width: 80%; padding: 10px; }
        #send { padding: 10px 20px; }
        .user { color: blue; margin: 5px 0; }
        .bot { color: green; margin: 5px 0; }
    </style>
</head>
<body>

<h2>Simple AI Chatbot (GitHub Pages Version)</h2>
<div id="chatbox"></div>

<input type="text" id="input" placeholder="Type your message...">
<button id="send">Send</button>

<script>
const API_KEY = "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";  // <-- paste your key here

document.getElementById("send").onclick = async function() {
    let msg = document.getElementById("input").value;
    if (msg === "") return;

    let chatbox = document.getElementById("chatbox");
    chatbox.innerHTML += "<div class='user'><b>You:</b> " + msg + "</div>";

    document.getElementById("input").value = "";

    let response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "user", content: msg }]
        })
    });

    let data = await response.json();
    let reply = data.choices[0].message.content;

    chatbox.innerHTML += "<div class='bot'><b>Bot:</b> " + reply + "</div>";
    chatbox.scrollTop = chatbox.scrollHeight;
};
</script>

</body>
</html>
